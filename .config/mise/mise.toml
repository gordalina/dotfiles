[bootstrap.packages]
"brew:mas" = "latest"
"mas:1289583905" = "latest" # Pixelmator Pro

[dotfiles]
"~/bin" = {}
"~/.config" = {}

"~/.Brewfile" = { source = "~/src/dotfiles/Brewfile" }
"~/.agents" = { source = "~/src/dotfiles/.config/agents" }
"~/.claude" = { source = "~/src/dotfiles/.config/claude" }
"~/.hushlogin" = { source = "~/src/dotfiles/.config/.hushlogin" }
"~/.orca" = { source = "~/src/dotfiles/.config/orca" }
"~/.ssh" = { source = "~/src/dotfiles/.config/ssh" }
"~/.zshenv" = { source = "~/src/dotfiles/.config/.zshenv" }
"~/Downloads/.DS_Store" = { source = "~/src/dotfiles/Downloads/.DS_Store" }

[bootstrap.macos.launchd.agents.mise-upgrade]
program = "/Users/sam/.local/bin/mise"
args = ["upgrade"]
start_calendar_interval = [{ hour = 6, minute = 0 }, { hour = 15, minute = 0 }]
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/mise-upgrade.log"
stderr_path = "~/Library/Logs/mise-upgrade.log"

[bootstrap.macos.launchd.agents.brew-upgrade]
program = "/opt/homebrew/bin/brew"
args = ["upgrade", "--yes"]
start_calendar_interval = { hour = 5, minute = 45 }
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/brew-upgrade.log"
stderr_path = "~/Library/Logs/brew-upgrade.log"

[settings]
experimental = true
dotfiles.root = "~/src/dotfiles"
dotfiles.default_mode = "symlink"
minimum_release_age_excludes = ["claude-code"]

[tools]
claude-code = "latest"
elixir = "1.19"
erlang = "28"
go = "1.26"
node = "26"
typos = "latest"

kubectl = "1.35"
kubectx = "latest"

"npm:skills" = "latest"
"npm:agent-browser" = "latest"
"go:meat.dev/cmd/meat" = "latest"

[tasks]
bootstrap = [
  "brew bundle --file=~/src/dotfiles/Brewfile",
  "bin/dot"
]
"bootstrap:once" = ["agent-browser install"]