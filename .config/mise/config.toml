[bootstrap.packages]
#"brew:postgresql@17" = "latest"
#"brew:ffmpeg" = "latest"
#"mas:497799835" = "latest"

[dotfiles]
"~/.Brewfile" = { source = "~/src/dotfiles/Brewfile" }
"~/.agents" = {}
"~/.claude" = {}
"~/.config" = {}
"~/.hushlogin" = {}
"~/.ssh" = {}
"~/.zshenv" = {}
"~/bin" = {}

[bootstrap.macos.launchd.agents.mise-upgrade]
program = "/opt/homebrew/bin/mise"
args = ["upgrade"]
start_calendar_interval = { hour = 5, minute = 30 }
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/Library/Logs/mise-upgrade.log"
stderr_path = "~/Library/Logs/mise-upgrade.log"

[settings]
experimental = true
dotfiles.root = "~/src/dotfiles"
dotfiles.default_mode = "symlink"

[tools]
claude-code = "latest"
elixir = "1.19.5"
erlang = "28.5.0.3"
"npm:skills" = "latest"
typos = "latest"
