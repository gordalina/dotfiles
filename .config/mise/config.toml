[settings]
experimental = true
dotfiles.root = "~/src/dotfiles"
dotfiles.default_mode = "symlink"

[tools]
claude-code = "latest"
elixir = "1.19.5"
erlang = "28.5.0.3"
"npm:skills" = "latest"
typos = "latest"
